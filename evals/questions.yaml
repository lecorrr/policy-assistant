  - id: S06
    ask_as: kateryna
    question: За який строк треба надати клієнту остаточну відповідь на скаргу?
    sources: [{doc: staff-complaints, evidence: "протягом 15 календарних днів з дня реєстрації"}]
    facts: ['15\s+(календарн\w+\s+)?дн']
  - id: S07
    ask_as: olena
    question: Якої мінімальної довжини має бути пароль до робочого облікового запису?
    sources: [{doc: staff-security, evidence: "щонайменше 14 символів"}]
    facts: ['14\s+символ']
  - id: S08
    ask_as: andrii
    question: Як повідомити про підозрілий фішинговий лист?
    sources: [{doc: staff-security, evidence: "повідомити про фішинг"}]
    facts: ['повідомити про фішинг|security@demokredyt\.example']

