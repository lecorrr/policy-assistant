# Evaluation set: 50 questions in Ukrainian with known answers, plus leak tests.
#
# sources: where the answer lives. A retrieved chunk counts as relevant when it comes from that
#   document (and section, if given) and contains the evidence text. Evidence is compared after
#   normalising case, whitespace, apostrophes, quotes and dashes, so it survives re-chunking.
#   A question with several sources is answered by any one of them.
# facts: regular expressions (case-insensitive) that a correct answer must all match.
# leak_as: users who may not read the answer. Each is asked the same question; nothing from the
#   sources may be retrieved for them, and their answer must not match all the facts.
# The law questions were written against the edition of 1734-VIII dated 30.07.2026.

law_edition: "30.07.2026"

questions:
  # --- The Consumer Lending law (every role may read it) ---
  - id: L01
    ask_as: andrii
    question: Скільки днів має клієнт, щоб відмовитися від договору про споживчий кредит?
    sources: [{doc: law-1734, section: "15", evidence: "протягом 14 календарних днів з дня укладення договору"}]
    facts: ['14\s+(календарн\w+\s+)?дн']
  - id: L02
    ask_as: olena
    question: Протягом якого строку клієнт має повернути гроші, якщо відмовився від кредитного договору?
    sources: [{doc: law-1734, section: "15", evidence: "протягом семи календарних днів з дати подання письмового повідомлення"}]
    facts: ['(7|семи|сім)\s+(календарн\w+\s+)?дн']
  - id: L03
    ask_as: olena
    question: Чи можна брати з клієнта плату за дострокове погашення споживчого кредиту?
    sources: [{doc: law-1734, section: "16", evidence: "забороняється встановлювати споживачу будь-яку плату"}]
    facts: ['заборон|нікчемн|не можна|не має права']
  - id: L04
    ask_as: andrii
    question: Яка максимальна денна процентна ставка за споживчим кредитом?
    sources: [{doc: law-1734, section: "8", evidence: "максимальний розмір денної процентної ставки"}]
    facts: ['\b1\s?%|\b1\s+відсот|одного відсот']
  - id: L05
    ask_as: taras
    question: У якій черговості погашаються вимоги, якщо платежу клієнта не вистачає на всю суму?
    sources: [{doc: law-1734, section: "19", evidence: "у першу чергу сплачуються прострочена до повернення сума кредиту"}]
    facts: ['прострочен', 'неустойк']
  - id: L06
    ask_as: taras
    question: Який максимальний розмір пені за простроченим платежем за споживчим кредитом?
    sources: [{doc: law-1734, section: "21", evidence: "не може бути більшою за 15 відсотків суми простроченого платежу"}]
    facts: ['15\s?(%|відсот)', 'подвійн']
  - id: L07
    ask_as: olena
    question: Чи можна в рекламі писати, що кредит надається під нуль відсотків?
    sources: [{doc: law-1734, section: "7", evidence: "кредит є безпроцентним чи надається під нуль процентів"}]
    facts: ['заборон|не можна|не допуска']
  - id: L08
    ask_as: andrii
    question: У який час колектори можуть самі телефонувати боржнику?
    sources: [{doc: law-1734, section: "25", evidence: "у період з 20 до 9 години"}]
    facts: ['\b20\b', '\b9\b']
  - id: L09
    ask_as: taras
    question: Скільки разів на добу кредитор чи колектор може взаємодіяти зі споживачем щодо боргу?
    sources: [{doc: law-1734, section: "25", evidence: "більше двох разів на добу"}]
    facts: ['дв(ох|а|ічі)\b|\b2\b']
  - id: L10
    ask_as: olena
    question: Чи можна брати плату за розгляд заявки на кредит?
    sources: [{doc: law-1734, section: "14", evidence: "кредитодавцю забороняється встановлювати плату за розгляд запиту"}]
    facts: ['заборон|не можна|безоплатн|не має права']
  - id: L11
    ask_as: kateryna
    question: За скільки днів кредитодавець має повідомити клієнта про зміну змінюваної процентної ставки?
    sources: [{doc: law-1734, section: "11", evidence: "не пізніш як за 15 календарних днів до дати"}]
    facts: ['15\s+календарн']
  - id: L12
    ask_as: andrii
    question: Як називається документ з умовами кредиту, який клієнт отримує до укладення договору?
    sources:
      - {doc: law-1734, section: "9", evidence: "за спеціальною формою (паспорт споживчого кредиту)"}
      - {doc: law-1734, section: "Додаток 1", evidence: "паспорт споживчого кредиту"}
    facts: ['паспорт\w*\s+споживч']
  - id: L13
    ask_as: taras
    question: Протягом якого строку кредитодавець має повідомити клієнта, що відступив право вимоги новому кредитору?
    sources: [{doc: law-1734, section: "18", evidence: "протягом 10 робочих днів з дати відступлення права вимоги"}]
    facts: ['10\s+робоч']
  - id: L14
    ask_as: olena
    question: Що обов'язково має містити реклама кредиту, якщо в ній вказана процентна ставка?
    sources: [{doc: law-1734, section: "7", evidence: "максимальна сума, на яку може бути виданий кредит"}]
    facts: ['максимальн\w*\s+сум', 'реальн\w*\s+річн', 'максимальн\w*\s+строк']
  - id: L15
    ask_as: andrii
    question: Кого Закон про споживче кредитування називає споживачем?
    sources: [{doc: law-1734, section: "1", evidence: "споживач - фізична особа, яка уклала або має намір укласти"}]
    facts: ['фізичн\w*\s+особ']
  - id: L16
    ask_as: kateryna
    question: Чи можна покласти на боржника витрати на врегулювання простроченої заборгованості?
    sources: [{doc: law-1734, section: "25", evidence: "забороняється покладати на споживача обов'язок з оплати"}]
    facts: ['заборон|не можна|не може|не має права']

  # --- Policies for all staff ---
  - id: S01
    ask_as: andrii
    question: За скільки днів до відпустки треба подати заяву?
