[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-assistant"
version = "0.1.3"
description = "Staff questions in Ukrainian, answered only from documents each role may read, with citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk>=2.4",
    "fastembed>=0.9",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
policy-assistant = "policy_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policy_assistant = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Raised inside langsmith, a LangChain dependency, on Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]
