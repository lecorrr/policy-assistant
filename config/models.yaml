# Answer models. Prices are USD per million tokens, checked on the date below:
#   https://developers.openai.com/api/docs/pricing
#   https://platform.claude.com/docs/en/about-claude/pricing
# options are passed to the LangChain model; config.py lists the allowed names.

prices_checked: 2026-11-10

default: local

# compared in the memo, in this order
memo: [local, gpt-6-luna, claude-haiku-5-5]

# Grades faithfulness in eval-answers; not one of the memo models. null skips it.
judge: claude-sonnet-5-5

models:
  local:
    provider: ollama
    model: gemma4:12b
    # thinking only adds time for short cited answers
    options: {reasoning: false, temperature: 0, num_ctx: 8192}
    price: {input: 0, output: 0}
    price_source: runs on this machine's GPU

  gpt-6-luna:
    provider: openai
    model: gpt-6-luna
    options: {reasoning_effort: low}
    price: {input: 0.10, output: 0.50}
    price_source: https://developers.openai.com/api/docs/pricing

  claude-haiku-5-5:
    provider: anthropic
    model: claude-haiku-5-5
    options: {effort: low}
    # prompts over 100k tokens cost more; ours are ~3k
    price: {input: 0.10, output: 0.50, long_prompt_tokens: 100000, long_input: 0.50, long_output: 2.50}
    price_source: https://platform.claude.com/docs/en/about-claude/pricing

  gpt-6.1-sol:
    provider: openai
    model: gpt-6.1-sol
    options: {reasoning_effort: low}
    price: {input: 2.00, output: 10.00}
    price_source: https://developers.openai.com/api/docs/pricing

  claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    options: {effort: low}
    price: {input: 2.00, output: 10.00}
    price_source: https://platform.claude.com/docs/en/about-claude/pricing
