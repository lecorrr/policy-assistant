# Answer models. Every model gets the same five excerpts and the same instructions.
#
# Prices are US dollars per million tokens, copied from each provider's pricing page on the
# date below. Update both when a price changes; the memo prints the date.
#   OpenAI:    https://developers.openai.com/api/docs/pricing
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#
# options go to the LangChain model as they are; only the names listed in config.py are allowed.

prices_checked: 2026-11-10

default: local

# The models the memo compares, in its column order.
memo: [local, gpt-6-luna, claude-haiku-5-5]

# Checks faithfulness during eval-answers. A stronger model than the three in the memo, so no
# model grades its own answers. Set to null to skip judging.
judge: claude-sonnet-5-5

models:
  local:
    provider: ollama
    model: gemma4:12b
    # Gemma 4 can think before answering; for short cited answers the thinking only adds time.
    options: {reasoning: false, temperature: 0, num_ctx: 8192}
    price: {input: 0, output: 0}
    price_source: runs on this machine's GPU

  gpt-6-luna:
    provider: openai
    model: gpt-6-luna
    options: {reasoning_effort: low}
    price: {input: 0.10, output: 0.50}
    price_source: https://developers.openai.com/api/docs/pricing

  claude-haiku-5-5:
    provider: anthropic
    model: claude-haiku-5-5
    options: {effort: low}
    # Prompts over 100,000 tokens cost more; ours are about 3,000.
    price: {input: 0.10, output: 0.50, long_prompt_tokens: 100000, long_input: 0.50, long_output: 2.50}
    price_source: https://platform.claude.com/docs/en/about-claude/pricing

  gpt-6.1-sol:
    provider: openai
    model: gpt-6.1-sol
    options: {reasoning_effort: low}
    price: {input: 2.00, output: 10.00}
    price_source: https://developers.openai.com/api/docs/pricing

  claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    options: {effort: low}
    price: {input: 2.00, output: 10.00}
    price_source: https://platform.claude.com/docs/en/about-claude/pricing
